name: Bob PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  bob-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so bob can diff properly

      - name: Install Bob Shell
        run: |
          curl -fsSL https://bob.ibm.com/download/bobshell.sh \
            --output /tmp/bobshell.sh
          bash /tmp/bobshell.sh --package-manager npm
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Generate PR diff
        run: |
          git config --global --add safe.directory '*'
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}"...HEAD > /tmp/pr.diff || true

      - name: Run Bob PR review
        id: bob_review
        run: |
          if [ ! -s /tmp/pr.diff ]; then
            echo "::error::PR diff is empty - check git fetch"
            exit 1
          fi
          DIFF="$(cat /tmp/pr.diff)"
          PROMPT="Review this PR diff. write it to a bob-review.md file. Flag bugs, security issues, and logic errors. Be concise — one line per finding: [file:line] severity: description. Skip style nits unless they mask a real problem."$'\n\n'"${DIFF}"
          if REVIEW=$(bob run \
              --accept-license \
              --trust \
              "$PROMPT" 2>&1); then
            echo "Bob Shell completed successfully."
          else
            STATUS=$?
            echo "::error::Bob Shell failed with exit code $STATUS"
            printf '%s\n' "$REVIEW" >&2
            exit "$STATUS"
          fi
        env:
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}

      - name: Post review as PR comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const review = fs.readFileSync('./bob-review.txt', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Bob Shell PR Review\n\n${review}`
            });
