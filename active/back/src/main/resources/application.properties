# =============================================================================
# Bürgerportal Musterstadt – Quarkus application configuration
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP server
# ---------------------------------------------------------------------------
quarkus.http.port=9080

# ---------------------------------------------------------------------------
# Datasource – H2 in-memory (same DB as legacy Liberty app)
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:buergerportal;DB_CLOSE_DELAY=-1;MODE=MySQL
quarkus.datasource.username=sa
quarkus.datasource.password=

# ---------------------------------------------------------------------------
# Hibernate ORM
# ---------------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect

# ---------------------------------------------------------------------------
# CORS – allow local React dev-server and any localhost origin
# ---------------------------------------------------------------------------
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With,X-Citizen-Id
quarkus.http.cors.exposed-headers=Location,Content-Disposition
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=24H

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-title=Bürgerportal Musterstadt REST API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for the Musterstadt citizen portal (migrated from JSF/Liberty)

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
quarkus.log.console.level=INFO
quarkus.log.category."com.musterstadt".level=DEBUG
