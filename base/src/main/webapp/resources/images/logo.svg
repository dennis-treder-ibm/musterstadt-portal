<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220">

  <defs>
    <style>
      .icon { fill:#675588; }
      .muster { fill:#FFFFFF; }
      .stadt { fill:#2ADDDD; }

      .wordmark {
        font-family: "IBM Plex Serif", Georgia, serif;
        font-size: 92px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Icon -->

  <g transform="translate(20,20)">
    <path class="icon"
      d="M90 10
         L160 30
         L160 110
         C160 150 140 180 90 205
         C40 180 20 150 20 110
         L20 30 Z"/>

    <rect x="45" y="80" width="20" height="40" fill="white"/>
    <rect x="115" y="80" width="20" height="40" fill="white"/>
    <rect x="75" y="55" width="30" height="65" fill="white"/>

    <polygon points="40,80 55,60 70,80" fill="white"/>
    <polygon points="110,80 125,60 140,80" fill="white"/>
    <polygon points="72,55 90,30 108,55" fill="white"/>
  </g>

  <!-- Wordmark -->

  <text x="220" y="140" class="wordmark">
    <tspan class="muster">Muster</tspan>
    <tspan class="stadt">stadt</tspan>
  </text>

</svg>