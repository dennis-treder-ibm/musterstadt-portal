# ── Server ──────────────────────────────────────────────────────────────────
quarkus.http.port=8080

# ── Datasource: H2 in-memory (matches original Liberty jdbc/buergerportal) ──
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:buergerportal;DB_CLOSE_DELAY=-1;MODE=MySQL
quarkus.datasource.username=sa
quarkus.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# Schema is managed by DataInitializer on StartupEvent (drop + recreate DDL).
# The named persistence unit BuergerportalPU is configured in persistence.xml
# (dialect + JDBC URL inline) so Hibernate can resolve it at build-time.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ── CORS ──────────────────────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-auth-token
quarkus.http.cors.exposed-headers=location,info
quarkus.http.cors.access-control-allow-credentials=false
quarkus.http.cors.access-control-max-age=24H

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/openapi
mp.openapi.extensions.smallrye.info.title=Bürgerportal Musterstadt REST API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=REST API for the Bürgerportal Musterstadt citizen portal
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.musterstadt".level=DEBUG
